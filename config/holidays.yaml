# Holiday/Event tags, keyed by ISO date (YYYY-MM-DD) -> event name.
#
# WHY THIS FILE EXISTS: PriceLabs' API does not expose a holiday/event tag
# field anywhere (checked the calendar/pricing endpoint, the neighborhood
# market-data endpoint, and the overrides endpoint -- none of them return a
# holiday name). The tagging you see in the PriceLabs dashboard calendar is a
# UI-only "Seasons & Events" feature with no API equivalent as of this
# writing. So this list is maintained by hand here instead.
#
# A date present in this file gets Category = "Holiday/Event" on every
# property's tab (overriding the weekday/weekend classification) and is
# EXCLUDED from flag logic by design -- see the "How This Works" tab and
# the caveats in README.md for why.
#
# Add/edit freely; add per-property overrides later if a date matters for
# one property but not another (not implemented yet -- currently global).

"2026-11-26": "Thanksgiving"
"2026-11-27": "Thanksgiving (Black Friday Eve)"
"2026-12-24": "Christmas Eve"
"2026-12-25": "Christmas Day"
"2026-12-31": "New Year's Eve"
"2027-01-01": "New Year's Day"
"2027-02-14": "Valentine's Day"
